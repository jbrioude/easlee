# EASLEE run environment (transport distribution).
# This is a plain Julia ENVIRONMENT, not a registered package: the engine is
# included by the run scripts (scripts/run_config.jl), so `julia --project=easlee`
# only has to provide these dependencies.
#   julia --project=easlee -e 'using Pkg; Pkg.instantiate()'
[deps]
Atomix = "a9b6321e-bd34-4604-b9c9-b65b8de01458"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
GRIB = "b16dfd50-4035-11e9-28d4-9dfe17e6779b"
Interpolations = "a98d9a8b-a2ab-59e6-89dd-64a1c18fca59"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
NetCDF = "30363a11-5582-574a-97bb-aa9a979735b9"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StructArrays = "09ab397b-f2b6-538f-b94a-2f83cf4a842a"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Tar = "a4e569a6-e804-4fa4-b0f3-eef7a1d5b13e"
eccodes_jll = "b04048ba-5ccd-5610-b3f6-85129a548705"
p7zip_jll = "3f19e933-33d8-53b3-aaab-bd5110c3b7a0"

# No Manifest.toml is shipped: `Pkg.instantiate()` resolves the newest versions
# compatible with the bounds below on YOUR Julia (1.10 or newer), so a stale pin
# cannot break the install.  The developer tree keeps its Manifest for
# reproducibility.  Reference versions tested 2026-09-04 (Julia 1.12.6) are
# listed in HOWTO.md §1.
[compat]
julia = "1.10"
Atomix = "1"
GRIB = "0.4"
Interpolations = "0.15, 0.16"
KernelAbstractions = "0.9"
NetCDF = "0.12"
StructArrays = "0.6, 0.7"
