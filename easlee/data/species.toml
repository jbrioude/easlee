[[species]]
name       = "HBr"
molar_mass = 80.91
phase      = "gas"
decay      = "stable"
# Volcanic bromine source gas (TODO #37, docs/MODEL_JUSTIFICATIONS.md §7).
# HBr is even more soluble than HCl: it dissociates fully in the aqueous/ice
# phase, so its EFFECTIVE Henry constant is ~1e9 M/atm — order(s) of magnitude
# above HCl's physical Henry (~2e3) and above the plume-washout effective value
# used for HCl (2e6, plume_phase.jl).  Consequence for the HT study: in a
# water-rich (phreatomagmatic) column HBr is scrubbed even more efficiently
# than HCl — how MUCH survives the plume is the science question the #37 run
# probes.  Refs: Sander (2015) "Compilation of Henry's law constants", ACP 15,
# 4399–4981 (H(HBr) intrinsic + acid-dissociation → very large H_eff);
# von Glasow et al. (2009), "The effects of volcanic eruptions on atmospheric
# chemistry", Chem. Geol. 263 (volcanic HBr solubility/scavenging).  The
# below-cloud A/B scale with HNO3 (also solubility-unlimited).  Values are
# ORDER-OF-MAGNITUDE per §7.
dry        = { reldiff = 1.9, henry = 1.0e9, f0 = 0.0 }
wet        = { below_a = 5.82e-5, below_b = 0.62 }
oh         = "?"

