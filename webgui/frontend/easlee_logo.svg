<svg viewBox="0 0 400 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EASLEE">
  <defs>
    <linearGradient id="eg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143a52"/>
      <stop offset="0.5" stop-color="#3a7ca5"/>
      <stop offset="1" stop-color="#8cbfdc"/>
    </linearGradient>
    <marker id="tip6" markerWidth="11" markerHeight="11" refX="6" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 L2.6,5 Z" fill="#8cbfdc"/>
    </marker>
  </defs>

  <!-- globe -->
  <circle cx="200" cy="140" r="86" fill="none" stroke="url(#eg6)" stroke-width="2.4"/>
  <ellipse cx="200" cy="140" rx="86" ry="26" fill="none" stroke="url(#eg6)" stroke-width="1" opacity="0.26"/>

  <!-- six trajectories: shared tangent at the source, fanning out with reach -->
  <path d="M158,176 C184,162 196,156 206,146" fill="none" stroke="url(#eg6)" stroke-width="2.0" stroke-linecap="round" opacity="0.78"/>
  <path d="M158,176 C186,161 214,150 234,132" fill="none" stroke="url(#eg6)" stroke-width="2.3" stroke-linecap="round" opacity="0.85"/>
  <path d="M158,176 C188,160 232,146 256,124" fill="none" stroke="url(#eg6)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M158,176 C190,159 252,142 278,116" fill="none" stroke="url(#eg6)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M158,176 C192,158 270,140 296,100" fill="none" stroke="url(#eg6)" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M158,176 C194,157 286,140 306,80"  fill="none" stroke="url(#eg6)" stroke-width="3.3" stroke-linecap="round" marker-end="url(#tip6)"/>

  <!-- parcels at the end of each trajectory (each sits on a streamline) -->
  <circle cx="206" cy="146" r="2.2" fill="#3a7ca5" opacity="0.75"/>
  <circle cx="234" cy="132" r="2.4" fill="#3a7ca5" opacity="0.8"/>
  <circle cx="256" cy="124" r="2.5" fill="#3a7ca5" opacity="0.82"/>
  <circle cx="278" cy="116" r="2.6" fill="#3a7ca5" opacity="0.85"/>
  <circle cx="296" cy="100" r="2.4" fill="#3a7ca5" opacity="0.8"/>

  <!-- source / release location -->
  <circle cx="158" cy="176" r="10" fill="none" stroke="#143a52" stroke-width="1.3" opacity="0.4"/>
  <circle cx="158" cy="176" r="5.2" fill="#143a52"/>

  <!-- wordmark -->
  <text x="200" y="292" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="600" letter-spacing="10" fill="#143a52">EASLEE</text>
</svg>
