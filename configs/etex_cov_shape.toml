# ETEX-1 covariance-kernel SHAPE-mode benchmark — the non-double-counting
# variant (design discussion 2026-07-07): kernel AREA = kNN spacing h²
# (statistical, vanishes with N), ANISOTROPY + receptor tilt from the
# flow-evolved P (shear-aligned smoothing).  Needs the kNN pass — with the
# boxing fix it costs ~1 s/refresh.  Compare against uniform / adaptive /
# covariance-physical on the same 400k/72h setup.
#
#     julia --project=easlee scripts/easlee.jl configs/etex_cov_shape.toml
#     julia --project=easlee validation/check_etex.jl results/etex/grid_etex_cov_shape.nc
name = "etex_cov_shape"
task = "transport"

[run]
direction = "forward"
start     = 1994-10-23T12:00:00
stop      = 1994-10-26T12:00:00     # 72 h — covers the main cloud passage
timestep  = "10min"
threads   = 6
benchmark = true

[[meteorology]]
model     = "ERA5"
path      = "/data/ETEX"
variables = "ERA5_CAPTEX"
available = "auto"

[[species]]
id   = "PMCH"
kind = "gas"

[[release]]
species   = "PMCH"
geometry  = "point"
lon       = [-2.0083]
lat       = [48.058]
z         = [8.0, 20.0]             # FLEXPART-11 ETEX release layer
zkind     = "agl"
time      = [1994-10-23T16:00:00, 1994-10-24T03:50:00]   # 11 h 50 (emit-t1.txt)
particles = 400000
mass      = "340kg"                 # 340 000 g PMCH (emit-t1.txt — NOT 340 g)

[physics]
ctl       = 10.0
ifine     = 10
  [physics.turbulence]
  scheme = "thomson"
  [physics.convection]
  scheme = "massflux"

[output]
kernel     = "covariance"
resolution = true                   # R(x) = (det P)^(1/4), mass-weighted
quantity = "concentration"
path     = "results/etex/"
interval = "3h"                     # one frame per 3-h ETEX sampling window
average  = "3h"                     # mean over the whole window (matches the obs)
sample   = "30min"                  # must be a multiple of run.timestep (10 min)

  [output.covariance]
  mode      = "shape"               # kNN area × P anisotropy (no double counting)
  sigma0    = "50m"                 # release footprint (≈ the 8–20 m stack scale)
  sigma_v   = 0.5                   # unresolved relative-dispersion velocity [m/s]
  tl        = "5min"                # its Lagrangian time scale (matches the
                                    # dispersion bandwidth-floor calibration)
  stride    = 1                     # evolve P every sync step (10 min)

[output.grid]
lon0 = -10.0
lat0 = 40.0
nx   = 399
ny   = 299
dx   = 0.1
dy   = 0.1
heights = [0.0, 100.0]              # single 0–100 m sampling layer (as the validation task)

  [output.receptors]
  file      = "data/ETEX/stations.txt"
  layer_top = "100m"
