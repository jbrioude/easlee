# Météo-France AROME, NATIVE NetCDF dissemination (hourly files AR_T0000P_<yyyymmdd>_<hh>.nc
# on the model's Lambert grid, ~1.3 km, full column with vertical velocity and TKE).
# This is the AROME format obtained directly from Météo-France; the GRIB2 boundary-layer
# extract distributed by ATMO Hauts-de-France is a DIFFERENT dataset — use
# configs/arome_hdf_france.toml (model = "AROME_HDF") for that one.
# Example: Réunion / south-west Indian Ocean domain, 2024-06-29.
name = "arome_meteofrance"

[[meteorology]]
available = "auto"                    # <path>/AVAILABLE is written on the first run
model     = "AROME"
path      = "/path/to/AROME/netcdf/"  # <- set to your AROME archive (see HOWTO.md)
variables = "AROME"

[run]
direction = "forward"
start     = 2024-06-29T12:00:00.000Z
stop      = 2024-06-29T13:30:00.000Z
timestep  = "5min"                   # km-scale grid: a few minutes (docs/CONFIG.md, synchronisation step)

[physics]
ctl   = 5.0
ifine = 4
    [physics.turbulence]
    scheme   = "hanna"
    onthefly = false
    [physics.convection]
    scheme = "massflux"
    [physics.deposition]
    dry = false
    wet = false
    [physics.vertical]
    mode     = "kinematic"
    diabatic = true

[[species]]
id             = "tracer"
kind           = "gas"
specnum        = 24
dry_deposition = false
wet_deposition = false

[[release]]
comment   = "Réunion boundary-layer release"
species   = "tracer"
lat       = [-20.463, -20.453]
lon       = [54.551, 54.561]
z         = [200.0, 300.0]
zkind     = "agl"
mass      = "1.0kg"
particles = 20000
time      = [2024-06-29T12:00:00.000Z, 2024-06-29T12:00:00.000Z]

[output]
quantity = "concentration"
interval = "30min"
average  = "30min"
sample   = "15min"
path     = "juliaout/arome_meteofrance/"
    [output.grid]
    crs     = "native"        # metres in the AROME Lambert projection
    nest    = 1
    origin  = [0.0, 0.0]
    spacing = [1300.0, 1300.0]
    size    = [219, 189]
    heights = [0.0, 20.0, 100.0, 200.0, 400.0, 800.0, 1600.0, 3000.0]
