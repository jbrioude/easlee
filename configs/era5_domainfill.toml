# ERA5 Pacific DOMAINFILL transport test (release kind = "domainfill").
# The box is filled ∝ air mass at t=0; the 4 box edges are replenished from the
# inflow mass flux each step; parcels leaving the box are culled.  Slice 4 of
# the config-driven engine refactor — no harness script, pure run_spec!.
name = "era5_domainfill"

[run]
direction = "forward"
# ERA5 20250520 met starts at 07:00 UTC → begin at 09:00.
start    = 2025-05-20T09:00:00
stop     = 2025-05-20T12:00:00
timestep = "15min"

[[meteorology]]
model     = "ERA5"
path      = "/data/ERA5/20250520/"
variables = "ERA5_CONV"
available = "auto"

[[species]]
id   = "AIR"
kind = "gas"

[[release]]
species   = "AIR"
kind      = "domainfill"
lon       = [150.0, 230.0]
lat       = [0.0, 50.0]
z         = [0.0, 10000.0]
zkind     = "agl"
time      = [2025-05-20T09:00:00, 2025-05-20T12:00:00]
particles = 50000

[physics]
ctl   = 2.0
ifine = 4
[physics.turbulence]
scheme = "none"
[physics.convection]
scheme = "off"

[output]
quantity = "concentration"
path     = "juliaout/output_era5_domainfill/"
interval = "3h"
sample   = "15min"
[output.grid]
lon0 = 150.0
lat0 = 0.0
nx   = 200
ny   = 125
dx   = 0.4
dy   = 0.4
heights = [0.0, 1000.0, 2000.0, 4000.0, 6000.0, 8000.0, 10000.0]
