# Polar-cap transport on the GLOBAL ERA5 archive (/data/ERA5_full, −90…90):
# release at 85°N — trajectories advance in a pole-centred stereographic plane
# poleward of [physics].polar_stereo_lat (FLEXPART switchnorth/switchsouth),
# so they cross the pole cleanly instead of hitting the 1/cos(lat) metric
# blow-up / the indy >= Nj kill at the top grid row.
name = "era5_polar"

[run]
direction = "forward"
# ERA5_full 20250101 met starts at 07:00 UTC (0600 cycle, step 1) → begin ≥ 09:00.
start    = 2025-01-01T09:00:00
stop     = 2025-01-02T09:00:00
timestep = "15min"
threads  = 4

[[meteorology]]
model     = "ERA5"
path      = "/data/ERA5_full/"
variables = "ERA5_FULL"
available = "auto"

[[species]]
id   = "AIR"
kind = "gas"

[[release]]
species   = "AIR"
lon       = [-10.0, 10.0]
lat       = [84.0, 86.0]
z         = [2000.0, 6000.0]
zkind     = "agl"
time      = [2025-01-01T09:00:00, 2025-01-01T10:00:00]
particles = 50000
mass      = "1kg"

[physics]
ctl   = 2.0
ifine = 4
# Stereo-plane position updates poleward of ±70° (the met reaches both poles;
# only the north cap matters for this release).  90 would disable.
polar_stereo_lat = 70.0
[physics.turbulence]
scheme = "hanna"
[physics.convection]
scheme = "off"

[output]
quantity = "concentration"
path     = "juliaout/output_era5_polar/"
interval = "6h"
sample   = "15min"
[output.grid]
# Whole polar cap, 1° × 0.25° (top cell edge exactly at the pole).
lon0 = -180.0
lat0 = 70.0
nx   = 360
ny   = 80
dx   = 1.0
dy   = 0.25
heights = [0.0, 2000.0, 4000.0, 6000.0, 8000.0, 12000.0]
