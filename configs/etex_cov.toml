# ETEX-1 covariance-kernel benchmark — the third estimator of the 2×2+1:
# per-parcel 2×2 covariance P evolved by resolved wind shear (P ← F·P·Fᵀ,
# F = I+∇u·dt) + turbulent growth (2·σv²·TL·dt), read only at evaluation
# (grid deposit: axis widths √Pxx/√Pyy, separable + renormalised → exact
# conservation; receptors: full bivariate Gaussian with the cxy tilt).
# NO kNN pass — the physical footprint replaces the statistical spacing.
#
#     julia --project=easlee scripts/easlee.jl configs/etex_cov.toml
#     julia --project=easlee validation/check_etex.jl results/etex/grid_etex_cov.nc
#
# Identical to output_etex_uni.toml (400k, 72 h, 0.1°, 3-h frames) except the
# kernel — accuracy AND wall time compare 1:1 against the uniform baseline
# (R 0.651/RANK 2.74) and the adaptive-kNN run (R 0.322/RANK 2.55).
name = "etex_cov"
task = "transport"

[run]
direction = "forward"
start     = 1994-10-23T12:00:00
stop      = 1994-10-26T12:00:00     # 72 h — covers the main cloud passage
timestep  = "10min"
threads   = 6
benchmark = true

[[meteorology]]
model     = "ERA5"
path      = "/data/ETEX"
variables = "ERA5_CAPTEX"
available = "auto"

[[species]]
id   = "PMCH"
kind = "gas"

[[release]]
species   = "PMCH"
geometry  = "point"
lon       = [-2.0083]
lat       = [48.058]
z         = [8.0, 20.0]             # FLEXPART-11 ETEX release layer
zkind     = "agl"
time      = [1994-10-23T16:00:00, 1994-10-24T03:50:00]   # 11 h 50 (emit-t1.txt)
particles = 400000
mass      = "340kg"                 # 340 000 g PMCH (emit-t1.txt — NOT 340 g)

[physics]
ctl       = 10.0
ifine     = 10
  [physics.turbulence]
  scheme = "thomson"
  [physics.convection]
  scheme = "massflux"

[output]
kernel     = "covariance"
resolution = true                   # R(x) = (det P)^(1/4), mass-weighted
quantity = "concentration"
path     = "results/etex/"
interval = "3h"                     # one frame per 3-h ETEX sampling window
average  = "3h"                     # mean over the whole window (matches the obs)
sample   = "30min"                  # must be a multiple of run.timestep (10 min)

  [output.covariance]
  sigma0    = "50m"                 # release footprint (≈ the 8–20 m stack scale)
  sigma_v   = 0.5                   # unresolved relative-dispersion velocity [m/s]
  tl        = "5min"                # its Lagrangian time scale (matches the
                                    # dispersion bandwidth-floor calibration)
  stride    = 1                     # evolve P every sync step (10 min)

[output.grid]
lon0 = -10.0
lat0 = 40.0
nx   = 399
ny   = 299
dx   = 0.1
dy   = 0.1
heights = [0.0, 100.0]              # single 0–100 m sampling layer (as the validation task)

  [output.receptors]
  file      = "data/ETEX/stations.txt"
  layer_top = "100m"
