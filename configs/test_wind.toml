# Tiny config to validate [run].wind dimensionality (freeze suppressed indices).
name = "test_wind"
task = "transport"

[run]
direction = "forward"
wind      = "1D-vertical"          # overridden by the test for each mode
start     = 1994-10-23T16:00:00
stop      = 1994-10-23T17:00:00
timestep  = "5min"

[[meteorology]]
model     = "ERA5"
path      = "data/ERA5_ETEX"
variables = "ERA5_CAPTEX"
available = "auto"

[[species]]
id = "tracer"
kind = "gas"

[[release]]
species   = "tracer"
geometry  = "box"
lon       = [0.0, 10.0]
lat       = [46.0, 52.0]
z         = [0.0, 5000.0]
zkind     = "agl"
time      = [1994-10-23T16:00:00, 1994-10-23T16:05:00]
particles = 5000
mass      = "1kg"

[output]
quantity = "concentration"
path     = "results/test_wind/"
interval = "1h"
average  = "5min"
sample   = "5min"
  [output.grid]
  lon0 = -10.0
  lat0 = 40.0
  dx   = 0.25
  dy   = 0.25
  nx   = 160
  ny   = 120
  heights = [0.0, 1000.0, 3000.0, 6000.0]

[physics]
ctl = 3.0
ifine = 4
  [physics.turbulence]
  scheme = "thomson"
  [physics.convection]
  scheme = "off"
