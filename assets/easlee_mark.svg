<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EASLEE">
  <defs>
    <linearGradient id="egm6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143a52"/>
      <stop offset="0.5" stop-color="#3a7ca5"/>
      <stop offset="1" stop-color="#8cbfdc"/>
    </linearGradient>
    <marker id="tipm6" markerWidth="11" markerHeight="11" refX="6" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 L2.6,5 Z" fill="#8cbfdc"/>
    </marker>
  </defs>
  <circle cx="100" cy="98" r="74" fill="none" stroke="url(#egm6)" stroke-width="2.6"/>
  <ellipse cx="100" cy="98" rx="74" ry="22" fill="none" stroke="url(#egm6)" stroke-width="1" opacity="0.26"/>

  <!-- six trajectories fanning from the source -->
  <path d="M66,128 C86,116 96,111 104,103" fill="none" stroke="url(#egm6)" stroke-width="1.8" stroke-linecap="round" opacity="0.78"/>
  <path d="M66,128 C88,115 112,106 128,92" fill="none" stroke="url(#egm6)" stroke-width="2.1" stroke-linecap="round" opacity="0.85"/>
  <path d="M66,128 C90,114 128,102 148,84" fill="none" stroke="url(#egm6)" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M66,128 C92,113 142,99 162,76"  fill="none" stroke="url(#egm6)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66,128 C94,112 152,98 170,62"  fill="none" stroke="url(#egm6)" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M66,128 C96,111 164,98 184,46"  fill="none" stroke="url(#egm6)" stroke-width="3.0" stroke-linecap="round" marker-end="url(#tipm6)"/>

  <!-- parcels sitting at the end of their trajectories (each on a streamline) -->
  <circle cx="128" cy="92"  r="2.2" fill="#3a7ca5" opacity="0.8"/>
  <circle cx="162" cy="76"  r="2.4" fill="#3a7ca5" opacity="0.85"/>
  <circle cx="170" cy="62"  r="2.2" fill="#3a7ca5" opacity="0.8"/>

  <!-- source / release location -->
  <circle cx="66" cy="128" r="9.5" fill="none" stroke="#143a52" stroke-width="1.3" opacity="0.42"/>
  <circle cx="66" cy="128" r="5"   fill="#143a52"/>
</svg>
